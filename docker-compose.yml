version: "3.8"

services:
  frontend:
    image: nginx:alpine
    container_name: zhilu-frontend
    ports:
      - "${FRONTEND_PORT:-8765}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
